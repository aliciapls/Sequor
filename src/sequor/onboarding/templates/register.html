<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Sequor Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/static/sequor_mark.svg">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --duck-50: #f0f9fb;
            --duck-100: #d9eef4;
            --duck-200: #b7ddea;
            --duck-300: #8fc5db;
            --duck-400: #5fa6c5;
            --duck-500: #3c8eaf;
            --duck-600: #2d7296;
            --duck-700: #1d5a77;
            --duck-800: #1a4a63;
            --slate-50: #f8fafc;
            --slate-100: #f1f5f9;
            --slate-200: #e2e8f0;
            --slate-300: #cbd5e1;
            --slate-400: #94a3b8;
            --slate-500: #64748b;
            --slate-600: #475569;
            --slate-700: #334155;
            --slate-800: #1e293b;
            --green-50: #f0fdf4;
            --green-500: #22c55e;
            --red-50: #fef2f2;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, var(--duck-50) 0%, #ffffff 40%, var(--duck-50) 100%);
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .signup-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--duck-200);
            border-radius: 20px;
            padding: 48px 44px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 4px 32px rgba(29, 90, 119, 0.10), 0 1px 4px rgba(29, 90, 119, 0.06);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            font-weight: 500;
            color: var(--slate-500);
            text-decoration: none;
            margin-bottom: 20px;
            transition: color 0.12s;
        }

        .back-link:hover { color: var(--duck-600); }
        .back-link svg { flex-shrink: 0; }

        .signup-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
            text-decoration: none;
        }

        .signup-logo-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .signup-logo-icon img {
            height: 38px;
            width: auto;
            display: block;
        }

        .signup-logo-text {
            font-size: 26px;
            font-weight: 700;
            color: var(--duck-800);
            letter-spacing: -0.5px;
        }

        .signup-heading {
            text-align: center;
            margin-bottom: 6px;
        }

        .signup-heading h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--slate-800);
            letter-spacing: -0.3px;
        }

        .signup-subtitle {
            text-align: center;
            font-size: 14px;
            color: var(--slate-500);
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--slate-700);
            margin-bottom: 6px;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 11px 15px;
            border: 1.5px solid var(--slate-200);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            color: var(--slate-800);
            background: white;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--duck-400);
            box-shadow: 0 0 0 3px rgba(60, 142, 175, 0.12);
        }

        .form-input::placeholder { color: var(--slate-400); }
        .form-select { cursor: pointer; }

        .form-hint {
            font-size: 12px;
            color: var(--slate-400);
            margin-top: 5px;
        }

        .btn-signup {
            width: 100%;
            padding: 13px 20px;
            background: linear-gradient(135deg, var(--duck-500), var(--duck-700));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
            margin-top: 8px;
            box-shadow: 0 2px 8px rgba(60, 142, 175, 0.25);
        }

        .btn-signup:hover {
            background: linear-gradient(135deg, var(--duck-600), var(--duck-800));
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(45, 114, 150, 0.32);
        }

        .btn-signup:active { transform: translateY(0); }
        .btn-signup:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

        .signup-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 13px;
            color: var(--slate-400);
            white-space: nowrap;
        }

        .signup-footer a {
            color: var(--duck-600);
            text-decoration: none;
            font-weight: 500;
        }

        .signup-footer a:hover { text-decoration: underline; }

        .alert {
            padding: 11px 15px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .alert-error {
            background: var(--red-50);
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: var(--green-50);
            color: #166534;
            border: 1px solid #bbf7d0;
        }
    </style>
</head>
<body>
<div class="signup-card">
    <a href="/" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back
    </a>

    <a href="/" class="signup-logo">
        <div class="signup-logo-icon"><img src="/static/sequor_mark.svg" alt="Sequor"></div>
        <span class="signup-logo-text">Sequor</span>
    </a>

    <div class="signup-heading">
        <h1>Create your account</h1>
    </div>
    <div id="signup-error" class="alert alert-error" style="display:none;"></div>

    <form id="signup-form">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="first_name">First name</label>
                <input type="text" id="first_name" class="form-input" placeholder="Alex" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="last_name">Last name</label>
                <input type="text" id="last_name" class="form-input" placeholder="Chen" required>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="company">Company name</label>
            <input type="text" id="company" class="form-input" placeholder="Acme Corp" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="email">Work email</label>
            <input type="email" id="email" class="form-input" placeholder="alex@acmecorp.com" autocomplete="email" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Min. 8 characters" minlength="8" required>
        </div>

        <button type="submit" class="btn-signup" id="signup-btn">Create account</button>
    </form>

    <div class="signup-footer">
        Already have an account? <a href="/portal/login">Sign in</a>
    </div>
</div>

<script>
    document.getElementById('signup-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        var btn = document.getElementById('signup-btn');
        var errorDiv = document.getElementById('signup-error');

        btn.textContent = 'Creating account…';
        btn.disabled = true;
        errorDiv.style.display = 'none';

        var firstName = document.getElementById('first_name').value.trim();
        var lastName = document.getElementById('last_name').value.trim();
        var company = document.getElementById('company').value.trim();
        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;

        var payload = {
            org_name: company,
            owner_email: email,
            owner_password: password,
            account_name: company,
            ownership_type: 'individual',
            backup_name: firstName + ' ' + lastName,
            backup_email: email,
            escalation_sla_hours: 4
        };

        try {
            var res = await fetch('/api/v1/onboarding', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            var data = await res.json();

            if (!res.ok) {
                errorDiv.textContent = data.detail || 'Account creation failed. Please try again.';
                errorDiv.style.display = 'block';
                btn.textContent = 'Create account';
                btn.disabled = false;
                return;
            }

            btn.textContent = 'Signing you in...';

            // Auto-login after signup so the user goes straight to dashboard
            var loginRes = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password }),
                credentials: 'same-origin'
            });

            if (loginRes.ok) {
                window.location.href = '/portal/dashboard';
            } else {
                window.location.href = '/portal/login?signup=success';
            }
        } catch (err) {
            errorDiv.textContent = 'Network error. Please check your connection and try again.';
            errorDiv.style.display = 'block';
            btn.textContent = 'Create account';
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
