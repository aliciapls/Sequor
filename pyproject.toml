[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sequor"
version = "0.1.0"
description = "Sequor — AI-powered communication coverage layer for teams"
authors = [
    {name = "Alicia Pang", email = "aliciapls@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # Kailash SDK
    "kailash>=2.8.6",
    "kailash-mcp>=0.2.4",
    "kailash-nexus>=2.0.3",
    "kailash-dataflow>=2.0.8",
    "kailash-kaizen>=2.7.4",
    "kailash-pact>=0.8.1",
    "kailash-ml>=0.9.0",
    "kaizen-agents>=0.9.2",
    # Email
    "sendgrid>=6.11.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.3.0",
    # AI / RAG
    "openai>=1.30.0",
    "tiktoken>=0.7.0",
    # Document parsing
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    # Billing
    "stripe>=9.0.0",
    # Scheduling
    "apscheduler>=3.10.0",
    # Encryption
    "cryptography>=43.0",
    # Utilities
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.1.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.135.3",
    "uvicorn>=0.43.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
ml = [
    # PyTorch - On Windows, install separately: pip install torch --index-url https://download.pytorch.org/whl/cu118
    "torch>=2.7.1",
]
align = [
    "kailash-align>=0.3.1",
]
all = [
    "kailash-align[all]>=0.3.1",
]
dev = [
    # Testing (pytest>=7.2.0 removes vulnerable py dependency)
    "pytest>=7.2.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    # Linting & Formatting
    "black>=23.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    # Security & Pre-commit
    "detect-secrets>=1.5.0",
    "pre-commit>=4.2.0",
]

[project.urls]
# TODO: Replace with your project URLs
# "Homepage" = "https://github.com/your-org/your-project"
# "Bug Tracker" = "https://github.com/your-org/your-project/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sequor*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
